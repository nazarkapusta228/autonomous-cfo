[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-cfo"
version = "0.1.0"
description = "Approval-driven CFO assistant for Collabothon 2026"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
legacy = ["streamlit>=1.40,<2", "plotly>=6,<7"]
dev = ["streamlit>=1.40,<2", "plotly>=6,<7", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

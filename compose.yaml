services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cfo
      POSTGRES_USER: cfo
      POSTGRES_PASSWORD: cfo_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfo -d cfo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:

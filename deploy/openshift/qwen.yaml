apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: cfo-vllm
  annotations:
    openshift.io/display-name: vLLM NVIDIA GPU (CFO)
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4
      command: [python, -m, vllm.entrypoints.openai.api_server]
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name=Qwen/Qwen2.5-7B-Instruct
      ports:
        - containerPort: 8080
      env:
        - {name: HF_HOME, value: /tmp/hf_home}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: cfo-qwen
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: Standard
    openshift.io/display-name: Qwen2.5-7B-Instruct
    opendatahub.io/model-type: generative
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    automountServiceAccountToken: false
    model:
      modelFormat: {name: vLLM}
      runtime: cfo-vllm
      storageUri: oci://registry.redhat.io/rhelai1/modelcar-qwen2-5-7b-instruct:1.5
      args:
        - --dtype=half
        - --max-model-len=4096
        - --max-num-seqs=4
        - --gpu-memory-utilization=0.90
        - --enforce-eager
      resources:
        requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
        limits: {cpu: "6", memory: 24Gi, nvidia.com/gpu: "1"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qwen-internal
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: cfo-qwen
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 8080, protocol: TCP}

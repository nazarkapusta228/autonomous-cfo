apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-cfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-cfo
  template:
    metadata:
      labels:
        app: autonomous-cfo
    spec:
      containers:
        - name: app
          image: IMAGE_REPLACE_BEFORE_DEPLOY
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - secretRef:
                name: cfo-settings
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-cfo
spec:
  selector:
    app: autonomous-cfo
  ports:
    - name: http
      port: 8501
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: autonomous-cfo
spec:
  to:
    kind: Service
    name: autonomous-cfo
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

apiVersion: batch/v1
kind: Job
metadata:
  generateName: cfo-liquidity-
  labels:
    app: cfo-agent
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/autonomous-cfo/autonomous-cfo:agent
          imagePullPolicy: Always
          command: [python, -m, cfo.cli]
          args: [run, liquidity, --request-id, "$(ASSESSMENT_ID)"]
          env:
            - name: ASSESSMENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
          envFrom:
            - secretRef: {name: cfo-settings}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
